<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4 Wednesday Practice Quiz</title>
    <style>
        /* --- Color Variables --- */
        :root {
            /* Default: Dark Theme */
            --bg-color: #2d343e; /* Dark background */
            --container-bg: #3c424f; /* Slightly lighter container */
            --text-color: #e8e6e3; /* Light text */
            --question-text-color: #8ab4f8; /* Light blue for questions */
            --lo-text-color: #b0c4de; /* Lighter blue for learning objective */
            --border-color: #555; /* Darker borders */
            --separator-color: #4a4f5a;
            --label-bg: #454c5a;
            --label-border: #6c757d;
            --label-hover-bg: #525966;
            --label-hover-border: #7a828a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover-bg: #a3c5f9;
            --button-disabled-bg: #5f6368;
            --feedback-correct-bg: #344e41;
            --feedback-correct-text: #c7f9cc;
            --feedback-correct-border: #52b788;
            --feedback-incorrect-bg: #5e2129;
            --feedback-incorrect-text: #f8d7da;
            --feedback-incorrect-border: #a4133c;
            --feedback-rationale-text: #adb5bd; /* Lighter gray for rationale */
            --feedback-source-text: #c7d3e0;
            --feedback-separator: #6c757d;
            --radio-accent: #8ab4f8;
        }

        .light-theme {
            --bg-color: #eef2f7;
            --container-bg: #ffffff;
            --text-color: #343a40;
            --question-text-color: #0056b3;
            --lo-text-color: #5a6e8a;
            --border-color: #dee2e6;
            --separator-color: #e9ecef;
            --label-bg: #f8f9fa;
            --label-border: #ced4da;
            --label-hover-bg: #e2e6ea;
            --label-hover-border: #adb5bd;
            --button-bg: #007bff;
            --button-text: white;
            --button-hover-bg: #0056b3;
            --button-disabled-bg: #6c757d;
            --feedback-correct-bg: #d1e7dd;
            --feedback-correct-text: #0f5132;
            --feedback-correct-border: #badbcc;
            --feedback-incorrect-bg: #f8d7da;
            --feedback-incorrect-text: #842029;
            --feedback-incorrect-border: #f5c2c7;
            --feedback-rationale-text: #495057;
            --feedback-source-text: #343a40;
            --feedback-separator: #ccc;
            --radio-accent: #007bff;
        }

        /* --- General Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.7;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle-button {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--label-border);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            z-index: 1000;
             transition: background-color 0.3s, color 0.3s;
        }
         #theme-toggle-button:hover {
             opacity: 0.8;
         }


        #quiz-container {
            max-width: 900px;
            margin: 80px auto 30px auto;
            background: var(--container-bg);
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .question-block {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--separator-color);
            transition: border-color 0.3s;
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 5px;
        }
        
        .learning-objective {
            font-size: 0.85em;
            font-style: italic;
            color: var(--lo-text-color);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--separator-color);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 18px;
            color: var(--question-text-color);
            transition: color 0.3s;
        }

        .options label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--label-border);
            background-color: var(--label-bg);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .options label:hover {
            background-color: var(--label-hover-bg);
            border-color: var(--label-hover-border);
        }

        .options input[type="radio"]:checked+span {
             font-weight: bold;
             color: var(--question-text-color);
        }
        .options input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--radio-accent);
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s, color 0.2s, opacity 0.2s;
            background-color: var(--button-bg);
            color: var(--button-text);
        }

        .check-button:hover {
            opacity: 0.85;
        }

         .check-button:disabled {
             background-color: var(--button-disabled-bg);
             cursor: not-allowed;
             opacity: 0.7;
         }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none;
            border: 1px solid transparent;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .feedback.correct {
            background-color: var(--feedback-correct-bg);
            color: var(--feedback-correct-text);
            border-color: var(--feedback-correct-border);
            display: block;
        }

        .feedback.incorrect {
            background-color: var(--feedback-incorrect-bg);
            color: var(--feedback-incorrect-text);
            border-color: var(--feedback-incorrect-border);
            display: block;
        }

        .feedback-status {
             font-weight: bold;
             font-size: 1.1em;
             display: block;
             margin-bottom: 8px;
        }

        .feedback-rationale {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--feedback-separator);
            font-size: 0.9em;
            color: var(--feedback-rationale-text);
            transition: color 0.3s, border-color 0.3s;
        }
        
        .feedback-source {
            margin-top: 10px;
            font-size: 0.85em;
            font-style: italic;
            color: var(--feedback-source-text);
            background-color: rgba(0,0,0,0.1);
            padding: 8px;
            border-radius: 4px;
        }

        h1 {
            text-align: center;
            color: var(--question-text-color);
            margin-top: 30px;
            margin-bottom: 30px;
            font-weight: 600;
            transition: color 0.3s;
        }

    </style>
</head>
<body>

    <button id="theme-toggle-button">Toggle Theme</button>
    <h1>Week 4 Wednesday Practice Quiz</h1>

    <div id="quiz-container">
        <!-- Questions will be loaded here by JavaScript -->
    </div>

    <script>
        const quizData = [
            // Endomembranes Questions
            {
                learningObjective: "LO 1 (Endomembranes): Define the term “Signal sequence” and describe how signal sequences are used to sort cargo to various cellular organelles.",
                question: "A protein that is destined to be imported into the mitochondrial matrix is synthesized in the cytosol. Which feature of this protein is essential for its correct targeting from the cytosol to the mitochondria?",
                options: { 
                    A: "A C-terminal KDEL sequence", 
                    B: "An N-terminal hydrophobic signal sequence", 
                    C: "An N-terminal signal sequence rich in positively charged amino acids", 
                    D: "A mannose-6-phosphate modification" 
                },
                correctAnswer: "C",
                rationale: "Mitochondrial import requires a specific N-terminal signal sequence. This sequence forms an amphipathic alpha-helix with positively charged amino acids (like arginine and lysine) on one side and hydrophobic residues on the other. This 'zipcode' is recognized by import receptors on the mitochondrial surface.",
                source: "'Import into mitochondria... EXAMPLE OF SIGNAL SEQUENCE +H3N-Met-Leu-Ser-Leu-Arg-Gln-Ser-Ile-Arg-Phe-Phe-Lys-Pro-Ala-Thr-Arg... Positively charged amino acids are shown in red...' (Endomembranes, Page 4)"
            },
            {
                learningObjective: "LO 1 (Endomembranes): Define the term “Signal sequence” and describe how signal sequences are used to sort cargo to various cellular organelles.",
                question: "A researcher genetically engineers a cytosolic protein to include a -Ser-Lys-Leu- sequence at its C-terminus. Where would this modified protein most likely be transported?",
                options: { 
                    A: "The nucleus", 
                    B: "The mitochondrial matrix", 
                    C: "The lumen of the ER", 
                    D: "The peroxisome" 
                },
                correctAnswer: "D",
                rationale: "The tripeptide sequence -Ser-Lys-Leu- (SKL) at the C-terminus of a protein is a well-characterized signal sequence that targets the protein for import into peroxisomes.",
                source: "'Import into peroxisomes... -Ser-Lys-Leu-' (Endomembranes, Page 4)"
            },
            {
                learningObjective: "LO 1 (Endomembranes): Define the term “Signal sequence” and describe how signal sequences are used to sort cargo to various cellular organelles.",
                question: "A soluble protein residing in the lumen of the endoplasmic reticulum, such as BiP, needs to be retained there and returned if it accidentally escapes to the Golgi. What signal sequence mediates this retrieval process?",
                options: { 
                    A: "An N-terminal hydrophobic sequence", 
                    B: "A C-terminal KDEL sequence", 
                    C: "A nuclear localization signal", 
                    D: "A mannose-6-phosphate tag" 
                },
                correctAnswer: "B",
                rationale: "Soluble ER-resident proteins contain a specific four-amino-acid retrieval signal at their C-terminus, commonly Lys-Asp-Glu-Leu (KDEL). This sequence is recognized by the KDEL receptor in the Golgi, which captures the protein and returns it to the ER in COPI-coated vesicles.",
                source: "'Soluble proteins such as BiP contain a “KDEL” retrieval sequence.' (Endomembranes, Page 21)"
            },
            {
                learningObjective: "LO 2 (Endomembranes): Describe how protein conformation is monitored in the endoplasmic reticulum and the fate of mis-folded proteins.",
                question: "A patient with the most common form of cystic fibrosis has a mutation (F508del) in the CFTR gene. Although the mutant protein retains some function, it fails to reach the plasma membrane. What is the primary reason for this trafficking defect?",
                options: { 
                    A: "The protein is not correctly glycosylated in the Golgi.", 
                    B: "The protein is improperly folded and is retained and degraded by the ER quality control system.", 
                    C: "The protein lacks the signal sequence for ER import.", 
                    D: "The protein is degraded in the lysosome immediately after synthesis." 
                },
                correctAnswer: "B",
                rationale: "The F508del mutation causes the CFTR protein to misfold. The ER has a stringent quality control system that recognizes and retains misfolded proteins. Because the F508del-CFTR protein cannot fold correctly, it is identified by chaperones, booted from the ER back into the cytosol, and degraded by the proteasome. Thus, it never reaches the plasma membrane.",
                source: "'The most common CF mutation (86%) is F508del... This version is not able to properly fold... because of the folding defect it never reaches the plasma membrane.' (Endomembranes, Page 14)"
            },
            {
                learningObjective: "LO 2 (Endomembranes): Describe how protein conformation is monitored in the endoplasmic reticulum and the fate of mis-folded proteins.",
                question: "When a large number of unfolded proteins accumulate in the ER, a signaling pathway is activated to alleviate this stress. This pathway slows down general protein synthesis and increases the transcription of genes encoding chaperones. What is this pathway called?",
                options: { 
                    A: "The apoptotic pathway", 
                    B: "The unfolded protein response (UPR)", 
                    C: "The secretory pathway", 
                    D: "The endocytic pathway" 
                },
                correctAnswer: "B",
                rationale: "The unfolded protein response (UPR) is a cellular stress response activated by an accumulation of unfolded or misfolded proteins in the ER lumen. It aims to restore homeostasis by reducing the protein load and increasing the folding capacity of the ER. If the stress is too severe or prolonged, the UPR will instead trigger apoptosis.",
                source: "'The cell turns on a signaling pathway called the Unfolded Protein Response (UPR). Slows down general protein translation; increases the transcription and translation of genes related to protein folding (chaperones).' (Endomembranes, Page 15)"
            },
            {
                learningObjective: "LO 2 (Endomembranes): Describe how protein conformation is monitored in the endoplasmic reticulum and the fate of mis-folded proteins.",
                question: "A misfolded protein in the ER is targeted for degradation. The process involves retro-translocation of the protein back into the cytosol, where it is tagged with a specific marker before being destroyed. What is this molecular tag?",
                options: { 
                    A: "Mannose-6-phosphate", 
                    B: "A SUMO protein", 
                    C: "A polyubiquitin chain", 
                    D: "A phosphate group" 
                },
                correctAnswer: "C",
                rationale: "Proteins that fail to fold correctly in the ER are exported back to the cytosol. Here, an E3 ubiquitin ligase complex attaches a chain of ubiquitin molecules to the misfolded protein. This polyubiquitin chain is the signal that targets the protein for degradation by the proteasome.",
                source: "'A protein translator associated with an ATPase and a ubiquitin ligase pulls the protein into the cytosol. Poly-ubiquitin chain is recognized by the proteasome; unfolded protein is degraded.' (Endomembranes, Page 12)"
            },
            {
                learningObjective: "LO 3 (Endomembranes): Describe the mechanism by which membrane fusion events are mediated.",
                question: "The specific fusion of a transport vesicle with its target membrane, such as a synaptic vesicle with the presynaptic plasma membrane, is a critical step in vesicular transport. This fusion is directly mediated by the interaction of which two families of proteins?",
                options: { 
                    A: "Clathrin and COPII proteins", 
                    B: "Rab proteins and Rab effectors", 
                    C: "v-SNAREs and t-SNAREs", 
                    D: "Adaptor proteins and cargo receptors" 
                },
                correctAnswer: "C",
                rationale: "While Rab proteins and their effectors mediate the initial tethering and docking, the actual fusion of the two lipid bilayers is driven by the pairing of SNARE proteins. v-SNAREs on the vesicle membrane interact with complementary t-SNAREs on the target membrane, forming a stable four-helix bundle (trans-SNARE complex) that pulls the membranes into close proximity and catalyzes their fusion.",
                source: "'Additional specificity is provided by the v and t SNAREs. v SNARES = vesicle; t SNARES = target organelle.' (The diagram shows SNAREs mediating the final fusion event). (Endomembranes, Page 19)"
            },
            {
                learningObjective: "LO 3 (Endomembranes): Describe the mechanism by which membrane fusion events are mediated.",
                question: "Botulinum toxin is a potent neurotoxin that causes flaccid paralysis by blocking neurotransmitter release at the neuromuscular junction. The toxin achieves this effect by functioning as a protease that cleaves which specific proteins?",
                options: { 
                    A: "Rab GTPases", 
                    B: "SNARE proteins", 
                    C: "Clathrin heavy chain", 
                    D: "Acetylcholine receptors" 
                },
                correctAnswer: "B",
                rationale: "The release of neurotransmitters requires the fusion of synaptic vesicles with the presynaptic membrane, a process mediated by SNARE proteins (like synaptobrevin, syntaxin, and SNAP-25). Botulinum toxin enters motor neurons and specifically cleaves these SNARE proteins, preventing the formation of the fusion complex and thereby blocking acetylcholine release.",
                source: "'Toxin cleaves certain SNARE proteins which are abundant at the synapse. Blocks neurotransmitter release.' (Endomembranes, Page 31)"
            },
            {
                learningObjective: "LO 3 (Endomembranes): Describe the mechanism by which membrane fusion events are mediated.",
                question: "The initial recognition and tethering of a transport vesicle to its correct target membrane is a highly specific process that precedes SNARE-mediated fusion. This specificity is primarily provided by the interaction between which two components?",
                options: { 
                    A: "A specific Rab-GTP on the vesicle and a Rab effector on the target membrane", 
                    B: "A v-SNARE on the vesicle and a t-SNARE on the target membrane", 
                    C: "A COPII coat on the vesicle and a receptor on the target membrane", 
                    D: "A clathrin coat on the vesicle and a receptor on the target membrane" 
                },
                correctAnswer: "A",
                rationale: "There are many different Rab proteins, each localized to a specific type of membrane compartment. In its active, GTP-bound state, a Rab protein on the surface of a vesicle binds to a specific Rab effector (tethering protein) on the correct target membrane. This interaction provides the initial specificity and physically tethers the vesicle, bringing it close enough for SNAREs to engage.",
                source: "'A specific Rab protein makes contact with a Rab effector protein on the target membrane. Provides specificity for docking.' (Endomembranes, Page 19)"
            },
            {
                learningObjective: "LO 4 (Endomembranes): Name the two secretory pathways that convey cargo from the Golgi to the plasma membrane, indicating their different functions and different mechanisms.",
                question: "A fibroblast cell is actively synthesizing and secreting collagen into the extracellular matrix. This process occurs continuously and does not require an external signal to trigger the release of the vesicles containing collagen. This is an example of which secretory pathway?",
                options: { 
                    A: "Regulated secretion", 
                    B: "Constitutive secretion", 
                    C: "Endocytosis", 
                    D: "Phagocytosis" 
                },
                correctAnswer: "B",
                rationale: "The constitutive secretory pathway is the default pathway that operates in all eukaryotic cells. It involves the continuous transport of proteins and lipids from the Golgi to the plasma membrane, where they are released (secreted) or incorporated into the membrane. This pathway does not require a specific signal for vesicle fusion.",
                source: "'Constitutive secretion is the default = no specific sorting signal. For example, collagen synthesized by fibroblasts.' (Endomembranes, Page 24)"
            },
            {
                learningObjective: "LO 4 (Endomembranes): Name the two secretory pathways that convey cargo from the Golgi to the plasma membrane, indicating their different functions and different mechanisms.",
                question: "In a pancreatic β-cell, insulin is stored in dense-core secretory vesicles. The release of insulin into the bloodstream is triggered by an increase in blood glucose levels. This 'on-demand' release is characteristic of which pathway?",
                options: { 
                    A: "Regulated secretion", 
                    B: "Constitutive secretion", 
                    C: "Transcytosis", 
                    D: "Autophagy" 
                },
                correctAnswer: "A",
                rationale: "The regulated secretory pathway is used by specialized cells to secrete products like hormones, neurotransmitters, or digestive enzymes only when needed. The products are packaged into secretory vesicles and stored in the cytoplasm until an external signal (like a hormone or a change in ion concentration) triggers the vesicles to fuse with the plasma membrane and release their contents.",
                source: "'signal such as hormone or neurotransmitter' triggers the 'REGULATED SECRETORY PATHWAY'. (Endomembranes, Page 24)"
            },
            {
                learningObjective: "LO 4 (Endomembranes): Name the two secretory pathways that convey cargo from the Golgi to the plasma membrane, indicating their different functions and different mechanisms.",
                question: "A mast cell degranulates in response to an allergen, rapidly releasing histamine-containing granules. This is a classic example of regulated exocytosis. Which of the following is a key feature that distinguishes this process from constitutive secretion?",
                options: { 
                    A: "It uses COPII-coated vesicles.", 
                    B: "It does not require SNARE proteins for fusion.", 
                    C: "Vesicles fuse with the plasma membrane only in response to a specific signal.", 
                    D: "It is the default pathway for all proteins leaving the Golgi." 
                },
                correctAnswer: "C",
                rationale: "The defining characteristic of the regulated secretory pathway is that the final step, the fusion of the secretory vesicle with the plasma membrane, is blocked until the cell receives an appropriate extracellular signal. In contrast, vesicles in the constitutive pathway fuse with the plasma membrane as soon as they arrive.",
                source: "'Synaptic vessels, mast cell granules are regulated.' (Endomembranes, Page 24)"
            },
            {
                learningObjective: "LO 5 (Endomembranes): Explain how cargo is transported into the cell and between organelles, the role of coat proteins in this process, and diseases that occur when this process is disrupted.",
                question: "A patient is diagnosed with I-cell disease (mucolipidosis II). Their fibroblasts are observed to be secreting large amounts of lysosomal enzymes into the extracellular medium instead of delivering them to the lysosome. This disease is caused by a defect in the enzyme that adds which specific tag to the lysosomal hydrolases in the Golgi?",
                options: { 
                    A: "A polyubiquitin chain", 
                    B: "A KDEL sequence", 
                    C: "A mannose-6-phosphate (M6P) group", 
                    D: "A GPI anchor" 
                },
                correctAnswer: "C",
                rationale: "The targeting of acid hydrolases to the lysosome depends on the mannose-6-phosphate (M6P) tag. This tag is added in the Golgi by the enzyme GlcNAc phosphotransferase. In I-cell disease, this enzyme is defective. Without the M6P tag, the lysosomal enzymes are not recognized by the M6P receptor and are instead missorted into the constitutive secretory pathway and secreted from the cell.",
                source: "'The targeting signal is a sugar modification; mannose 6-phosphate (M6P). The enzyme responsible for this modification is N-acetylglucosamine-1 phosophotransferase... Mutations in this enzyme are associated with lysosomal disorders (I cell disease).' (Endomembranes, Page 22)"
            },
            {
                learningObjective: "LO 5 (Endomembranes): Explain how cargo is transported into the cell and between organelles, the role of coat proteins in this process, and diseases that occur when this process is disrupted.",
                question: "The endocytosis of LDL cholesterol particles from the plasma is mediated by the LDL receptor. This process begins with the formation of a vesicle at the plasma membrane. The cytoplasmic surface of this vesicle is covered by a specific protein that forms a basket-like lattice. What is this coat protein?",
                options: { 
                    A: "COPI", 
                    B: "COPII", 
                    C: "Clathrin", 
                    D: "Caveolin" 
                },
                correctAnswer: "C",
                rationale: "Receptor-mediated endocytosis, such as the uptake of LDL, utilizes clathrin-coated pits. The LDL receptor, upon binding LDL, clusters in these pits. Adaptor proteins link the receptor's cytoplasmic tail to clathrin, which then assembles into a polyhedral cage (a 'triskelion' basket) that helps deform the membrane and pinch off to form a clathrin-coated vesicle.",
                source: "'LDL is recognized by LDL receptors on the cell surface; recruits adaptor proteins, Clathrin, bud formation, etc.' (Endomembranes, Page 29)"
            },
            {
                learningObjective: "LO 5 (Endomembranes): Explain how cargo is transported into the cell and between organelles, the role of coat proteins in this process, and diseases that occur when this process is disrupted.",
                question: "A researcher is studying the budding of transport vesicles from the endoplasmic reticulum (ER) that are destined for the Golgi apparatus. These vesicles are responsible for anterograde transport. Which type of protein coat is involved in the formation of these vesicles?",
                options: { 
                    A: "Clathrin", 
                    B: "COPI", 
                    C: "COPII", 
                    D: "Reticulon" 
                },
                correctAnswer: "C",
                rationale: "Vesicular transport from the ER to the Golgi is mediated by vesicles coated with COPII proteins. The COPII coat assembles on the ER membrane at specialized 'exit sites' and is responsible for selecting cargo and physically shaping the membrane into a budding vesicle.",
                source: "'secretory protein' is shown budding from the ER in a 'COPII coat' as part of the 'FORWARD PATHWAY'. (Endomembranes, Page 21)"
            },
            // Cell Cycle Regulation, Cell Death & Tissue Homeostasis Questions
            {
                learningObjective: "LO 1 (Cell Cycle Regulation): Describe how growth factors signal to Rb and how Rb regulates the Restriction point of the cell cycle (external input into the intrinsic machinery of the cell cycle).",
                question: "A quiescent fibroblast in the G0 phase is stimulated with a growth factor. This initiates a signal transduction cascade that leads to the synthesis of Cyclin D. The Cyclin D/CDK4/6 complex then phosphorylates a key protein, allowing the cell to pass the restriction point and enter S phase. What is this key protein target?",
                options: { 
                    A: "p53", 
                    B: "E2F", 
                    C: "Retinoblastoma protein (Rb)", 
                    D: "p21" 
                },
                correctAnswer: "C",
                rationale: "The retinoblastoma protein (Rb) is the gatekeeper of the G1/S restriction point. In its active, unphosphorylated state, Rb binds to and sequesters the E2F transcription factor, preventing the expression of genes needed for S phase. Growth factor signaling leads to the activation of Cyclin D/CDK4/6, which phosphorylates (inactivates) Rb. This releases E2F, allowing it to activate transcription and drive the cell into S phase.",
                source: "'Signal Transduction Cascade... activates (phosphorylates) CDK/cyclin that phosphorylates and inactivates RB.' (Cell Cycle Regulation, Page 7)"
            },
            {
                learningObjective: "LO 1 (Cell Cycle Regulation): Describe how growth factors signal to Rb and how Rb regulates the Restriction point of the cell cycle (external input into the intrinsic machinery of the cell cycle).",
                question: "A patient is diagnosed with retinoblastoma, a tumor of the eye. This cancer is caused by the loss of function of the Rb protein. How does the loss of active Rb protein lead to uncontrolled cell proliferation?",
                options: { 
                    A: "It causes constitutive activation of growth factor receptors.", 
                    B: "It leads to the continuous sequestration and inactivation of E2F.", 
                    C: "It results in the constitutive activation of the E2F transcription factor.", 
                    D: "It prevents the cell from entering mitosis." 
                },
                correctAnswer: "C",
                rationale: "The primary tumor suppressor function of Rb is to act as a 'brake' on the cell cycle by inhibiting the E2F transcription factor. When both alleles of the RB1 gene are lost or inactivated, there is no functional Rb protein to sequester E2F. E2F is therefore always active, continuously driving the transcription of S-phase genes and leading to uncontrolled cell proliferation.",
                source: "'active (unphosphorylated) Rb protein blocks cell growth by sequestering the E2F transcription factor(s).' (Cell Cycle Regulation, Page 8)"
            },
            {
                learningObjective: "LO 1 (Cell Cycle Regulation): Describe how growth factors signal to Rb and how Rb regulates the Restriction point of the cell cycle (external input into the intrinsic machinery of the cell cycle).",
                question: "Certain types of human papillomavirus (HPV) can cause cancer by producing a protein called E7. The E7 oncoprotein promotes cell cycle progression by binding to and inactivating a host tumor suppressor protein. Which protein is the target of HPV E7?",
                options: { 
                    A: "p53", 
                    B: "p21", 
                    C: "Cyclin D", 
                    D: "Rb" 
                },
                correctAnswer: "D",
                rationale: "The HPV E7 protein functionally inactivates the Rb tumor suppressor. By binding to Rb, E7 prevents Rb from sequestering E2F. This leads to the inappropriate activation of E2F-responsive genes and pushes the cell through the restriction point, contributing to uncontrolled proliferation.",
                source: "This is a classic example of viral oncogenesis targeting the Rb pathway. The core concept is that inactivating Rb (either by mutation, phosphorylation, or a viral protein) is a common mechanism for disrupting cell cycle control. (Cell Cycle Regulation, Page 10)"
            },
            {
                learningObjective: "LO 2 (Cell Cycle Regulation): Understand the principles of flow cytometry.",

        const quizContainer = document.getElementById('quiz-container');
        const themeToggleButton = document.getElementById('theme-toggle-button');
        const bodyElement = document.body;

        function applyTheme(theme) {
            if (theme === 'light') {
                bodyElement.classList.add('light-theme');
                themeToggleButton.textContent = 'Switch to Dark Mode';
            } else {
                bodyElement.classList.remove('light-theme');
                themeToggleButton.textContent = 'Switch to Light Mode';
            }
            localStorage.setItem('quizTheme', theme);
        }

        function loadQuiz() {
            quizData.forEach((qData, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');
                questionBlock.id = `q${index}`;

                const loText = document.createElement('div');
                loText.classList.add('learning-objective');
                loText.textContent = qData.learningObjective;
                questionBlock.appendChild(loText);

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                questionText.innerHTML = `${index + 1}. ${qData.question}`;
                questionBlock.appendChild(questionText);

                const optionsDiv = document.createElement('div');
                optionsDiv.classList.add('options');

                for (const optionKey in qData.options) {
                    const optionId = `q${index}_${optionKey}`;
                    const label = document.createElement('label');
                    label.htmlFor = optionId;
                    const radioInput = document.createElement('input');
                    radioInput.type = 'radio';
                    radioInput.name = `q${index}`;
                    radioInput.value = optionKey;
                    radioInput.id = optionId;
                    const labelText = document.createElement('span');
                    labelText.textContent = ` ${optionKey}. ${qData.options[optionKey]}`;
                    label.appendChild(radioInput);
                    label.appendChild(labelText);
                    optionsDiv.appendChild(label);
                }
                questionBlock.appendChild(optionsDiv);

                const buttonContainer = document.createElement('div');
                buttonContainer.classList.add('button-container');

                const checkButton = document.createElement('button');
                checkButton.textContent = 'Check Answer';
                checkButton.classList.add('check-button');
                checkButton.onclick = () => checkAnswer(index);
                buttonContainer.appendChild(checkButton);
                
                questionBlock.appendChild(buttonContainer);

                const feedbackDiv = document.createElement('div');
                feedbackDiv.classList.add('feedback');
                questionBlock.appendChild(feedbackDiv);

                quizContainer.appendChild(questionBlock);
            });
        }

        function checkAnswer(questionIndex) {
            const questionBlockElement = document.getElementById(`q${questionIndex}`);
            const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');

            if (!selectedRadioButton) {
                alert("Please select an answer first.");
                return;
            }

            const selectedOptionKey = selectedRadioButton.value;
            const qData = quizData[questionIndex];
            const feedbackDiv = questionBlockElement.querySelector('.feedback');
            const correct = selectedOptionKey === qData.correctAnswer;

            let feedbackHTML = '';

            if (correct) {
                feedbackHTML = `<span class="feedback-status">Correct!</span>`;
                feedbackDiv.className = 'feedback correct';
            } else {
                 feedbackHTML = `<span class="feedback-status">Incorrect.</span> The correct answer is ${qData.correctAnswer}.`;
                feedbackDiv.className = 'feedback incorrect';
            }

            feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
            feedbackHTML += `<div class="feedback-source">${qData.source}</div>`;
            feedbackDiv.innerHTML = feedbackHTML;
        }

        themeToggleButton.addEventListener('click', () => {
            if (bodyElement.classList.contains('light-theme')) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            applyTheme(savedTheme);
            loadQuiz();
        });

    </script>
